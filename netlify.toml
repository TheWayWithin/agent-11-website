# AGENT-11 Website - Production Deployment Configuration
# Optimized for Next.js 14 App Router with performance, security, and reliability

[build]
  # Build configuration for Next.js 14
  command = "npm run build"
  # Let @netlify/plugin-nextjs determine publish directory
  
  # Build environment
  environment = { NODE_ENV = "production", NEXT_TELEMETRY_DISABLED = "1", NODE_VERSION = "18" }

# Let @netlify/plugin-nextjs handle all processing

# Production redirects - let Netlify Next.js plugin handle routing

# Security headers for production
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

    # HSTS - Prevents SSL stripping attacks (NEW - Phase 1 Security Enhancement)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

    # Enhanced Permissions-Policy - Blocks additional attack vectors (ENHANCED - Phase 1)
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()"

    # CSP Enforcement - Active Content Security Policy (PHASE 2 - A+ SECURITY)
    # Must stay byte-identical to the policy in src/middleware.ts. When two CSP
    # headers are sent, the browser enforces the intersection, so any drift
    # silently blocks something. This one still whitelisted Google Tag Manager
    # and Google Analytics - neither of which the site loads - while omitting
    # plausible.io, which it does. Corrected under A11W-ISS-4.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://plausible.io https://api.github.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

    # Performance headers
    X-DNS-Prefetch-Control = "on"

    # Custom headers
    X-Powered-By = "AGENT-11"

# Static asset caching (1 year)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API route headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
    # Apex, matching SITE_URL in src/lib/seo.ts. www 301s here, so a www
    # origin would never have matched a real request anyway. A11W-ISS-5.
    Access-Control-Allow-Origin = "https://agent-11.com"

# Fonts and media optimization
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"

# Functions configuration for API routes
[functions]
  # Next.js serverless functions
  directory = ".netlify/functions"
  node_bundler = "esbuild"

# Deploy contexts
[context.production]
  command = "npm run build"
  
[context.production.environment]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

[context.deploy-preview]
  command = "npm run build"
  
[context.branch-deploy]
  command = "npm run build"

# Plugin configuration for Next.js 14
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "netlify-plugin-submit-sitemap"
  
  [plugins.inputs]
    # Apex: this is the URL submitted to Google and Bing on every deploy, so
    # it has to be the canonical host. A11W-ISS-5.
    baseUrl = "https://agent-11.com"
    sitemapPath = "/sitemap.xml"
    providers = [
      "google",
      "bing"
    ]

# Netlify Forms configuration for email capture
[template]
  incoming-hooks = ["GitHub"]

# Form handling configuration
[build.processing]
  skip_processing = false
  
[build.processing.html]
  pretty_urls = true

# Form processing configuration
# Using array syntax for multiple form definitions
[[forms]]
  name = "lead-magnet-capture"
  
  # Form settings
  [forms.settings]
    # Redirect after successful submission (optional)
    # redirect = "/thank-you"
    
    # Email notifications
    [forms.settings.notification]
      enabled = true
      # Add your email for notifications
      # to = ["your-email@example.com"]
      subject = "New AGENT-11 release-updates signup"

  # Spam detection
  [forms.settings.spam]
    honeypot = "bot-field"

  # Custom success message. The old one told people to check their email for a
  # "Quick Start Kit" that did not exist and that nothing sent (A11W-ISS-6).
  # The form name below is a legacy slug kept so existing submissions are not
  # orphaned; the form itself is a release-updates list.
  [forms.settings.success]
    message = "Thanks - you're on the list for AGENT-11 release updates. Nothing is being emailed to you now; everything is already public at github.com/TheWayWithin/agent-11."

# Large Media (if needed for future assets)
[lfs]
  gitlfs = false