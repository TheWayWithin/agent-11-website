# AGENT-11 Website - Production Deployment Configuration
# Optimized for Next.js 14 App Router with performance, security, and reliability

[build]
  # Build configuration for Next.js 14
  command = "npm run build"
  # Let @netlify/plugin-nextjs determine publish directory
  
  # Build environment
  environment = { NODE_ENV = "production", NEXT_TELEMETRY_DISABLED = "1", NODE_VERSION = "18" }

# Let @netlify/plugin-nextjs handle all processing

# Production redirects - let Netlify Next.js plugin handle routing

# Security headers for production
[[headers]]
  for = "/*"
  [headers.values]
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    
    # Performance headers
    X-DNS-Prefetch-Control = "on"
    
    # Custom headers
    X-Powered-By = "AGENT-11"

# Static asset caching (1 year)
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# API route headers
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "public, max-age=300, stale-while-revalidate=3600"
    Access-Control-Allow-Origin = "https://www.agent-11.com"

# Fonts and media optimization
[[headers]]
  for = "/*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "font/woff2"

# Functions configuration for API routes
[functions]
  # Next.js serverless functions
  directory = ".netlify/functions"
  node_bundler = "esbuild"

# Deploy contexts
[context.production]
  command = "npm run build"
  
[context.production.environment]
  NODE_ENV = "production"
  NEXT_TELEMETRY_DISABLED = "1"

[context.deploy-preview]
  command = "npm run build"
  
[context.branch-deploy]
  command = "npm run build"

# Plugin configuration for Next.js 14
[[plugins]]
  package = "@netlify/plugin-nextjs"

[[plugins]]
  package = "netlify-plugin-submit-sitemap"
  
  [plugins.inputs]
    baseUrl = "https://www.agent-11.com"
    sitemapPath = "/sitemap.xml"
    providers = [
      "google",
      "bing"
    ]

# Forms (if needed for future contact forms)
[template]
  incoming-hooks = ["GitHub"]

# Large Media (if needed for future assets)
[lfs]
  gitlfs = false