<!DOCTYPE html>
<html>
<head>
  <title>Netlify Forms - Agent-11</title>
  <meta name="robots" content="noindex">
</head>
<body>
  <!-- This file helps Netlify detect our forms during build time -->
  
  <!-- Hero Email Capture Form -->
  <form name="email-capture-hero" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="email-capture-hero" />
    <input type="hidden" name="bot-field" />
    <input type="email" name="email" />
    <input type="text" name="variant" />
    <input type="text" name="lead-magnet" />
    <input type="text" name="timestamp" />
  </form>

  <!-- Modal Email Capture Form -->
  <form name="email-capture-modal" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="email-capture-modal" />
    <input type="hidden" name="bot-field" />
    <input type="email" name="email" />
    <input type="text" name="variant" />
    <input type="text" name="lead-magnet" />
    <input type="text" name="timestamp" />
  </form>

  <!-- Inline Email Capture Form -->
  <form name="email-capture-inline" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="email-capture-inline" />
    <input type="hidden" name="bot-field" />
    <input type="email" name="email" />
    <input type="text" name="variant" />
    <input type="text" name="lead-magnet" />
    <input type="text" name="timestamp" />
  </form>

  <!-- Footer Email Capture Form -->
  <form name="email-capture-footer" netlify netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="email-capture-footer" />
    <input type="hidden" name="bot-field" />
    <input type="email" name="email" />
    <input type="text" name="variant" />
    <input type="text" name="lead-magnet" />
    <input type="text" name="timestamp" />
  </form>
</body>
</html>
